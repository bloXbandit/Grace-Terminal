
services:
  redis:
    image: redis:7-alpine
    container_name: grace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  grace:
    build:
      context: ./
      dockerfile: ./containers/app/Dockerfile
    image: grace-ai:custom
    container_name: grace-app
    env_file:
      - .env
    environment:
      - TZ=America/New_York  # Production timezone (EST/EDT)
      - DOCKER_HOST_ADDR=host.docker.internal
      - ACTUAL_HOST_WORKSPACE_PATH=${WORKSPACE_BASE:-$PWD/workspace}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    ports:
      - "5005:5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.cache:/.cache
      - ${WORKSPACE_BASE:-$PWD/data}:/app/data
      - ${WORKSPACE_BASE:-$PWD/workspace}:/app/workspace
      - ./.backups:/app/.backups
      
      # HOT RELOAD: Mount source code for instant updates (no rebuild needed)
      - ./src:/app/src:cached
      - ./containers:/app/containers:cached
      - ./Makefile:/app/Makefile:cached
      - ./public:/app/public:cached  # Mount frontend build for instant updates
      - ./frontend/vite.config.js:/app/frontend/vite.config.js:cached  # Mount only config for allowedHosts
      - ./frontend/src/view/lemon/components/Sidebar.vue:/app/frontend/src/view/lemon/components/Sidebar.vue:cached  # Mount Sidebar for UI hang fix
      - ./frontend/src/view/menu/secondMenu.vue:/app/frontend/src/view/menu/secondMenu.vue:cached  # Mount secondMenu for async navigation fix
      - ./frontend/src/components/markdown/index.vue:/app/frontend/src/components/markdown/index.vue:cached  # Mount markdown for content type safety
      - ./frontend/src/services/message.js:/app/frontend/src/services/message.js:cached  # Mount message handlers for content type safety
      - ./frontend/src/services/see-agent.js:/app/frontend/src/services/see-agent.js:cached  # Mount see-agent for SSE cleanup fix
      - ./frontend/src/store/modules/chat.js:/app/frontend/src/store/modules/chat.js:cached  # Mount chat store for Vue Render Storm fix & SSE cleanup
      - ./frontend/src/view/lemon/components/ChatPanel.vue:/app/frontend/src/view/lemon/components/ChatPanel.vue:cached  # Mount ChatPanel for lifecycle guards & SSE cleanup
      - ./frontend/src/view/lemon/components/ChatHeader.vue:/app/frontend/src/view/lemon/components/ChatHeader.vue:cached  # Mount ChatHeader for voice feature hot-reload
      - ./frontend/src/view/lemon/message:/app/frontend/src/view/lemon/message:cached  # Mount message components for Vue render error fixes
      
      # Local filesystem access - Mount entire home for fluid access
      # This prevents Frankenstein state by always seeing latest user files
      - ${HOME}:/host/home:cached
    stdin_open: true
    tty: true
    # Source code mounted for hot reload - restart container to apply changes
    command: make run
    depends_on:
      - redis

volumes:
  redis-data:
